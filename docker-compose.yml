version: "3.9"

services:

  # ── Frontend (Next.js) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - traders_world

  # ── Backend (FastAPI) ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////data/traders_world.db
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - KNOWLEDGE_PATH=/knowledge
      - ENV=development
    volumes:
      - ./backend:/app
      - ./knowledge:/knowledge:ro
      - ./data:/data
      - ./prompts:/prompts:ro
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000
    depends_on:
      - chromadb
    networks:
      - traders_world

  # ── ChromaDB (Vector Store) ────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - ./data/chroma:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - traders_world

networks:
  traders_world:
    driver: bridge

volumes:
  data:
